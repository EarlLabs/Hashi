# =============================================================================
# hashi Warden stack — deploy/warden/docker-compose.yml
# =============================================================================
# WHAT: runs this project's Warden as its OWN stack, joined to the Kaizen
#       network so it can reach the Hub at tracker:9104 and be dialled back at
#       hashi-warden:9200.
#
# WHY separate from deploy/docker-compose.yml: the product stack (control plane,
#       Postgres, Caddy) and the agent fleet have nothing to do with each other.
#       You will often want one without the other — the Warden running while the
#       VPN is down is the normal case for a project under construction.
#
# HOW:
#   make warden-sync          # refresh the vendored kit from Kaizen
#   make warden-up            # build and start (enrolls, then waits for approval)
#   # approve it: ask Кая, use the panel's Fleet view, or:
#   #   curl -X POST -H "Authorization: Bearer $TRACKER_ADMIN_TOKEN" \
#   #        http://localhost:8770/projects/hashi/approve
#   make warden-logs
# =============================================================================

name: hashi-warden

services:
  warden:
    container_name: hashi-warden
    build:
      context: ../..                     # the hashi repo root
      dockerfile: deploy/warden/Dockerfile
    restart: unless-stopped
    environment:
      HUB_ADDR: "tracker:9104"
      PROJECT_NAME: "hashi"
      # What the Hub dials to reach us. Must match the container name on the
      # shared network, or dispatch silently never arrives.
      GRPC_ADDR: "hashi-warden:9200"
      BIND_ADDR: "0.0.0.0:9200"
      # One Directive at a time: the fleet edits a real working tree with no
      # worktree isolation, so two at once would interleave their diffs.
      MAX_CONCURRENT: "1"
      REPO_ROOT: "/repo"
      STATE_DIR: "/state"
      CLAUDE_CONFIG_DIR: "/state/claude"
      CLAUDE_MODEL: "opus"
      # Conversation runs cheaper than construction. Seven of the eight personas
      # are opus and a pipeline spends several per Directive, so the plan's
      # limit — not the machine — is what decides how often the fleet can run.
      CLAUDE_ASK_MODEL: "${CLAUDE_ASK_MODEL:-sonnet}"
      # low | medium | high | xhigh | max. `low` while the fleet writes plans and
      # decisions; RAISE IT before M1 starts producing code — effort bought back
      # in review costs more than effort spent writing.
      CLAUDE_EFFORT: "${CLAUDE_EFFORT:-low}"
      CLAUDE_ASK_EFFORT: "${CLAUDE_ASK_EFFORT:-low}"
      # A run silent this long never started: no quota, no credential, bad flag.
      FIRST_OUTPUT_TIMEOUT_S: "${FIRST_OUTPUT_TIMEOUT_S:-120}"
      # Contract test mode — see deploy/warden/scenarios.py. Empty in normal
      # use; `WARDEN_FAKE_PIPELINE=1 make warden-up` simulates the fleet so the
      # protocol paths can be proven without spending a real run. A Directive
      # under this flag reports success having built nothing, so it must never
      # be left on.
      WARDEN_FAKE_PIPELINE: "${WARDEN_FAKE_PIPELINE:-}"
      WARDEN_FAKE_STEP_S: "${WARDEN_FAKE_STEP_S:-3}"
      # Git identity and credential for the fleet. The entrypoint turns these
      # into git config and a `gh` login at boot; no agent ever reads the value.
      # Empty GH_TOKEN is a supported mode — the fleet stays local-only and
      # reports changed files instead of a PR. `-` defaults keep the stack
      # bootable from a bare .env.
      GH_TOKEN: "${GH_TOKEN:-}"
      GIT_USER_NAME: "${GIT_USER_NAME:-hashi fleet}"
      GIT_USER_EMAIL: "${GIT_USER_EMAIL:-fleet@example.com}"
      REPO_URL: "${REPO_URL:-}"
    volumes:
      # The real repository, read-write: the fleet's whole job is to change it.
      # This is the one mount worth thinking twice about — an unattended fleet
      # has the same write access to this tree that you do.
      - ../..:/repo
      # ...but NOT the real .env. The template is mounted over it, so inside the
      # container `/repo/.env` holds the same fake values as `.env.example`.
      #
      # WHY a mount and not a rule: "NEVER read or print .env" lives in CLAUDE.md
      # and in every persona, and it is a REQUEST — the fleet has Read and Bash
      # against a read-write mount, so nothing enforces it. One agent that greps
      # the tree for a hostname, one `cat` in a debugging step, and a live
      # GH_TOKEN and the key that encrypts every node credential are in a
      # transcript. This line makes the rule true instead of asked for.
      #
      # Nothing breaks: the Warden receives GH_TOKEN and friends through
      # `environment:` above, resolved from the REAL .env on the host by
      # `--env-file`. Only processes INSIDE the container see the template.
      - ../../.env.example:/repo/.env:ro
      # Enrollment secret, the issued Hub token, and the claude CLI's login.
      # Named volume so a `docker compose down` does not force a re-login.
      - hashi-warden-state:/state
    networks:
      - kaizen

networks:
  kaizen:
    # Created by the Kaizen stack; this project only joins it.
    name: kaizen_default
    external: true

volumes:
  hashi-warden-state:
