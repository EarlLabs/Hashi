[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hashi"
version = "0.0.0"
description = "Self-hosted multi-protocol VPN control plane"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "jinja2",
]

# Persistence dependencies (sqlalchemy, asyncpg, alembic) are deliberately absent
# until the control plane actually has a database. Adding a dependency is an
# architect decision — see .claude/projects/00-core-invariants.md §5.
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "pyyaml",
]

[tool.setuptools]
packages = ["control", "control.app", "edge", "edge.transports"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
