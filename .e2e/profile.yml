# hashi — how THIS project does e2e.
#
# WHAT: the five answers an e2e agent needs, as commands rather than concepts.
# WHY:  written now, while the deployment shape is fresh, so it is accurate when
#       something finally consumes it.
# HOW:  the /e2e method file now exists (.claude/commands/e2e.md, copied
#       byte-for-byte from Kaizen's docs/e2e/command/e2e.md) and reads this
#       profile first (its §0). This is live automation, not a description.
kit_version: 1

env:
  mode: local
  isolation: per-run

# 2026-08-09: this project's Warden now runs on `dind` (DOCKER_HOST points at
# hashi-dind:2375) so /e2e can execute from inside the fleet container.
# THREE consequences, none fully closed yet — flagging rather than silently
# patching kit-owned or product files:
#   1. `boot.ready` and `run.all` target the DIND CONTAINER's hostname, never
#      127.0.0.1 — a published port lands on hashi-dind, not on localhost or
#      on `warden`. `run.all` passes E2E_API_HOST=hashi-dind so the Makefile's
#      own test-e2e readiness probe agrees with boot.ready below.
#   2. deploy/docker-compose.yml's Caddy bind mount
#      (./caddy/Caddyfile:/etc/caddy/Caddyfile:ro) resolves against DIND'S OWN
#      filesystem, which has no such file — this WILL mount empty/fail under
#      dind. Needs an architecture call (bake the Caddyfile into the image via
#      COPY, or a named volume populated at build time) on
#      deploy/docker-compose.yml, which is project-owned, not kit-owned.
#   3. deploy/warden/Dockerfile (kit-rendered) installs neither `make` nor a
#      Python matching this project's tests (`run.one` below needs `.venv`,
#      built by the HOST's `make setup`, not present in the fleet image) — so
#      /e2e cannot actually execute from inside the fleet container yet. This
#      is a kit-template gap (Kaizen: infra/agentkit/templates/deploy/warden/
#      Dockerfile), not something to hand-patch in this rendered copy.
boot:
  # The e2e stack is its own compose project (hashi-e2e) on its own ports, so it
  # never shares a volume with the dev stack. Probe 54200, not 54100 — 54100 is
  # the dev stack, and probing it would report "ready" for a stack that is
  # not up. Neither is a service default: the host already runs something on
  # 8000.
  up:      "make e2e-up"
  ready:   "curl -fsS http://hashi-dind:54200/healthz"
  timeout: 120
  reset:   "make e2e-reset"     # isolation is per-run; nothing to reset
  down:    "make e2e-down"

run:
  # `make test-e2e` rather than raw pytest: it checks the stack is actually up
  # and turns pytest's exit 5 ("no tests ran") into an honest "no scenarios yet"
  # instead of a failure on a fresh clone. E2E_API_HOST=hashi-dind matches
  # boot.ready above — see the dind note near the top of this file.
  all:       "E2E_API_HOST=hashi-dind make test-e2e"
  one:       ".venv/bin/pytest {file}::{name} -q"
  write_to:  "tests/e2e/<zone>/"     # control | edge | infra — the owning zone
  report:    "junit:.e2e/artifacts/{run}/results.xml"
  artifacts: ".e2e/artifacts/{run}/"
  on_fail:
    # -p hashi-e2e is load-bearing: without it this collects logs from the dev
    # project and prints nothing while the failing stack sits there.
    - "docker compose --env-file .env -p hashi-e2e -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml logs --no-color"

needs:
  - key:   HASHI_SECRET_KEY
    where: env-file                 # .env, passed by every Make target as --env-file
    why:   "the control plane refuses to boot without it"

# The honesty section. Copy it into each scenario's docstring.
boundary:
  real:     [control, postgres]
  stubbed:  []
  external: []
  # Deliberately absent, and the most important line here: NO real node, no real
  # tunnel and no Russian network are part of any e2e run. Charter criterion 1
  # ("survives a whitelist shutdown") cannot be proven by this suite — only by a
  # real device on a real mobile network. Never report it as covered.
