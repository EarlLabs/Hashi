     Until he does, the real .env is inside the fleet's read-write mount."
  - "Q1 widens the change beyond the warden stack to the product-stack Make
     targets. Deliberate and required by S1, but it is the largest blast radius in
     this task."
  - "README.md and CLAUDE.md at the repo root describe the env file's location and
     belong to no zone — architect follow-up, not Potts's."
  - "S2 cannot execute here (no container runtime). Must never be reported green."
