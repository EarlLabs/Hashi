corrections:
  B1:
    document: ".claude/projects/02-edge-rulebook.md"
    anchors: ["layout block :30", "contract table :66", "testing bullet :81", "new section before ## Testing"]
    applied: false
    now_says: >-
      render_client(node, credential) -> ClientEntry, not -> dict. The transport
      owns its URI serialisation end to end and returns the complete client
      entry: `entry` (the finished one-line serialisation for this node x this
      transport, with no display label), plus protocol-agnostic metadata —
      `display_label`, `country_label` (from the node record's location label,
      never a geo lookup) and `node_id`. control orders, composes the display
      text, appends it as the URI fragment, joins and base64-encodes; it treats
      every field as opaque text, never parses `entry`, never branches on a
      value, never compares a label or transport name against a literal. Stated
      test of the contract: adding a transport adds zero lines to the
      subscription renderer. A transport whose serialisation cannot carry an
      externally appended label is not deliverable in the v1 format — a PO
      question, not a licence to move assembly into control.
  B3:
    document: ".claude/projects/02-edge-rulebook.md"
    anchors: ["'Where a new file goes' :37-39", "new section 'Completing the contract'"]
    applied: false
    now_says: >-
      The contract table keeps the default port range and the rulebook now names
      the two symbols that are ahead of the code — TransportMeta lacks the port
      range, ClientEntry does not exist. Adding both to edge/registry.py is
      authorised inside M1 item 1 (edge-transport-contract-vless-reality) and
      only there, on the stated ground that this is the contract being completed
      for the first time rather than widened for a special case. From the second
      transport onward the existing rule applies unchanged and without appeal: a
      transport needing a registry edit is a contract failure — stop and raise
      it. 'Where a new file goes' carries a forward reference so a developer
      meets the exception where they would otherwise escalate.
  N2:
    document: ".claude/workflow.md"
    anchors: ["iron rules 1-4 :28-37", "new section 'What origin actually is'"]
    applied: false
    verified_state: >-
      origin = https://github.com/earlzdev/Hashi.git; only remote branch is
      remotes/origin/main; local main tracks it; develop is local only.
    now_says: >-
      The false bold claim 'This repository has no origin yet' is gone. Rule 4's
      sync command drops `git pull origin develop` (no origin/develop exists, so
      it fails literally) and is a local `git checkout develop && git merge main
      --no-edit`, with an optional fetch + --ff-only on main for the remote's
      state. A new section states the three facts that make rules 1 and 3
      readable: origin exists and carries only main; develop is local only so
      `gh pr create --base develop` has no target; rule 1 is not contradicted by
      main being the published branch because the owner published it and pushing
      anything is on the charter's always-ask list — no agent pushes any branch,
      develop included, without the owner saying so for that task. Until develop
      is published and pushing authorised, completion reports which files changed
      instead of a PR link.
