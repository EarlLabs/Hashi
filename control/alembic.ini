# Alembic configuration for the control plane.
#
# WHAT: points Alembic at control/migrations and nowhere else.
# WHY:  core invariants §2 — every schema change goes through a migration, because
#       `create_all` against a changed model silently diverges from a live database
#       and the failure mode is "every friend is locked out".
# HOW:  `alembic -c control/alembic.ini upgrade head`, which is what the container
#       entrypoint runs before serving. The URL is NOT here: it comes from
#       HASHI_DATABASE_URL via env.py, so this file holds no credentials and can be
#       committed.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..

# Migration filenames get a readable prefix; the revision id still comes from
# Alembic. Without this, `versions/` sorts by random hex and a reviewer cannot see
# the order at a glance.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

# WARN, not INFO: SQLAlchemy's engine logger at INFO writes every statement with
# its bound parameters, and this schema's parameters include subscription tokens.
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
