# hashi — how THIS project does e2e.
#
# WHAT: the five answers an e2e agent needs, as commands rather than concepts.
# WHY:  written now, while the deployment shape is fresh, so it is accurate when
#       something finally consumes it.
# HOW:  the /e2e method file now exists (.claude/commands/e2e.md, copied
#       byte-for-byte from Kaizen's docs/e2e/command/e2e.md) and reads this
#       profile first (its §0). This is live automation, not a description.
kit_version: 1

env:
  mode: local
  isolation: per-run

# 2026-08-09: this project's Warden runs on `dind` (DOCKER_HOST points at
# hashi-dind:2375) so /e2e can execute from inside the fleet container. Four
# consequences. The first three were flagged here before anything had ever been
# run; 2026-08-08 (task hashi-e2e-e2e-113) was the first real run, and it
# settled them:
#   1. `boot.ready` and `run.all` target the DIND CONTAINER's hostname, never
#      127.0.0.1 — a published port lands on hashi-dind, not on localhost or
#      on `warden`. `run.all` passes E2E_API_HOST=hashi-dind so the Makefile's
#      own test-e2e readiness probe agrees with boot.ready below.
#      CONFIRMED, plus one thing the note missed: the port also has to be
#      PUBLISHED on something other than dind's own loopback, or nothing can
#      reach it. Hence `E2E_BIND_ADDR=0.0.0.0` in boot.up — an explicit opt-in
#      that only makes sense because dind is an isolated engine. The default
#      stays 127.0.0.1 for a laptop. See deploy/docker-compose.dev.yml.
#   2. The Caddy bind mount did fail under dind, exactly as predicted (Docker
#      created a DIRECTORY at the missing host path and then refused to mount it
#      over the image's file, taking the whole stack down with it). FIXED: the
#      Caddyfile is baked into an image — deploy/docker/caddy.Dockerfile — so
#      the config travels with the artefact instead of with the checkout.
#   3. STILL OPEN: deploy/warden/Dockerfile (kit-rendered) installs neither
#      `make` nor a Python matching this project's tests. On 2026-08-08 the run
#      was done by invoking the underlying commands directly (the Makefile
#      recipes, by hand) and by installing Python 3.14 into the container — the
#      `make` half is still a kit-template gap (Kaizen:
#      infra/agentkit/templates/deploy/warden/Dockerfile), not something to
#      hand-patch in this rendered copy.
#   4. NEW: the e2e stack must not inherit the owner's real HASHI_PUBLIC_HOST.
#      Caddy cannot get a certificate for a name that does not point here, so it
#      retried ACME forever and never served a request — and against a name that
#      IS real it would ask a public CA for the production certificate on every
#      test run. deploy/docker-compose.e2e.yml pins the stack to `localhost`,
#      which Caddy serves from its own internal CA.
boot:
  # The e2e stack is its own compose project (hashi-e2e) on its own ports, so it
  # never shares a volume with the dev stack. Probe 54200, not 54100 — 54100 is
  # the dev stack, and probing it would report "ready" for a stack that is
  # not up. Neither is a service default: the host already runs something on
  # 8000.
  up:      "make e2e-up E2E_BIND_ADDR=0.0.0.0"
  ready:   "curl -fsS http://hashi-dind:54200/healthz"
  timeout: 120
  reset:   "make e2e-reset"     # isolation is per-run; nothing to reset
  down:    "make e2e-down"

run:
  # `make test-e2e` rather than raw pytest: it checks the stack is actually up
  # and turns pytest's exit 5 ("no tests ran") into an honest "no scenarios yet"
  # instead of a failure on a fresh clone. E2E_API_HOST=hashi-dind matches
  # boot.ready above — see the dind note near the top of this file.
  all:       "E2E_API_HOST=hashi-dind make test-e2e"
  one:       ".venv/bin/pytest {file}::{name} -q"
  write_to:  "tests/e2e/<zone>/"     # control | edge | infra — the owning zone
  report:    "junit:.e2e/artifacts/{run}/results.xml"
  artifacts: ".e2e/artifacts/{run}/"
  on_fail:
    # -p hashi-e2e is load-bearing: without it this collects logs from the dev
    # project and prints nothing while the failing stack sits there.
    - "docker compose --env-file .env --env-file deploy/e2e.env -p hashi-e2e -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml -f deploy/docker-compose.e2e.yml logs --no-color"

needs:
  - key:   HASHI_SECRET_KEY
    where: env-file                 # .env, passed by every Make target as --env-file
    why:   "the control plane refuses to boot without it"
  # 2026-08-09 (e2-117): the e2e stack no longer depends on the owner's `.env`
  # being COMPLETE. deploy/e2e.env is a second --env-file, committed and fake,
  # supplying every variable the base compose file requires. Before it, a `.env`
  # missing HASHI_OPERATOR_USERNAME (as the owner's was) made the whole suite
  # unbootable, and the failure read as a compose error rather than as an
  # incomplete environment. Anything that shells out to compose must pass BOTH
  # files, in that order — see tests/e2e/conftest.py.

# The honesty section. Copy it into each scenario's docstring.
boundary:
  real:     [control, postgres, caddy]
  # M37.4: a Bot API fake (.e2e/fake_telegram.py) the stand's control plane polls in
  # place of Telegram, with a test-only side the scenarios inject through. It proves the
  # bot's loop composes inside the real control plane; it says nothing about whether
  # api.telegram.org answers from the entry box, which is the owner's own run.
  stubbed:  [telegram]
  external: []
  # Deliberately absent, and the most important line here: NO real node, no real
  # tunnel and no Russian network are part of any e2e run. Charter criterion 1
  # ("survives a whitelist shutdown") cannot be proven by this suite — only by a
  # real device on a real mobile network. Never report it as covered.
