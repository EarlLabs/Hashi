# hashi — aikit's answers.
#
# WHAT: the one file aikit reads. Every skill, both agents and both binaries take
#       their project-specific values from here.
# WHY:  aikit ships a method, not templates — nothing of it is rendered into this
#       repository, so upgrading the plugin changes nothing here. That only holds
#       while these values are right, which is why `/aikit:init` ends by running
#       them rather than by declaring success.
# HOW:  hand-edited like any other config. The reference is the plugin's own
#       docs/config.md; the harness contract is docs/harness.md.
#
# NOT a zone: this file, like CLAUDE.md and pyproject.toml, belongs to none of the
# three. A change touching only unzoned files runs `verify_all`.
version: 1

# Every document in this repository — the charter, the plan, the runbook, the
# research — is written in English, so aikit's owner-facing output is too. This
# key controls ONLY what is written for a human; model-facing instructions are
# always English regardless.
language: en

plan:
  path: docs/PLAN.md
  # The plan is prose a person reads, so aikit matches its words rather than
  # imposing a schema. These are aikit's own shape, chosen deliberately on
  # 2026-09-08: the plan that existed at init time used `## M1 —` headings with
  # `### Steps` / `### Done when` subheadings, which gives step-loop no unit to
  # iterate — its steps were list items, not headings. `/aikit:plan` rewrites the
  # file into the shape below; the content survives, only the headings change.
  markers:
    # Keyed on the STATUS GLYPH, not the number. A milestone is what merges and
    # goes through acceptance; a step is what goes through review. `^##+\s` would
    # match both, plus every plain section like "Decisions needed from you", and
    # a marker that matches a step silently turns every step into a milestone.
    milestone: "^## [→✅]"
    step: "^### M"
    done_when: "Done when"
    acceptance: "acceptance"
    # Quoted KEYS on purpose: under YAML 1.1 — which PyYAML still speaks — bare
    # `yes:` and `no:` parse as the booleans true and false, so both keys vanish
    # and the marker lookup finds nothing, quietly.
    "yes": "yes"
    "no": "no"

# Per-milestone artefacts. Same root the fleet's own workflow already uses
# (`.claude/workflow.md`, "Task ID and tracker directory") — committed, never
# deleted, not after completion and not after a cancellation.
tracker: docs/tracker
# Screenshots and tree dumps. Gitignored: they swell the repository and leave
# nothing readable in the history.
evidence: .acceptance

# How this project proves itself. One entry per zone, matching CLAUDE.md's own
# table and project.json — three sources for the same three zones, and they must
# not drift.
#
# `paths` is a ROUTING KEY, not a permission fence: it answers "which verify and
# which rulebook apply to this change". An agent is not confined to it — a zone
# whose verify runs `pytest tests/control` is pointing AT that directory, so a
# step writing a test there is in scope even where `paths` did not list it.
zones:
  - key: control
    label: Control plane (FastAPI)
    paths: ["control/**", "tests/control/**", "tests/e2e/control/**"]
    rulebook: .claude/projects/01-control-rulebook.md
    verify: "make test-control"
  - key: edge
    label: Edge (pure config-rendering library)
    paths: ["edge/**", "tests/edge/**", "tests/e2e/edge/**"]
    rulebook: .claude/projects/02-edge-rulebook.md
    verify: "make test-edge"
  - key: infra
    label: Deploy / CI / infra
    paths:
      - "deploy/**"
      - ".github/**"
      - "Makefile"
      - "scripts/**"
      - ".e2e/**"
      - ".env.example"
      - "tests/infra/**"
      - "tests/e2e/infra/**"
    rulebook: .claude/projects/04-infra-rulebook.md
    verify: "make test-infra"

# The gate. Changed 2026-09-09, on the owner's instruction. It was `make test`, which
# deliberately excludes `tests/e2e/` — and CI ran the same three zone targets, so
# NOTHING ran the e2e scenarios at all. `panel-bootstrap.sh`'s own idempotency
# scenario had been failing since the day it was written and was found by
# accident, eleven milestones into a field run. `make verify` is `make test` plus
# the stand booted, `tests/e2e/` run against it, and the stand torn down.
#
# It costs ~15 minutes and needs a docker engine, which is why `make test` still
# exists and still excludes e2e: a fast gate people actually run, and an honest
# one that closes the loop. Steps gate on their zone's own verify; this is for a
# multi-zone change and for closing a milestone.
verify_all: "make verify"

review:
  # This project's own persona, not aikit's shipped one. Both are edit-incapable
  # and both end on the same `VERDICT:` line the loop parses; this one also reads
  # CLAUDE.md, the zone rulebooks and docs/decisions.md, which aikit's cannot know
  # about.
  reviewer: reviewer-strict
  # No `model:` block. Every agent inherits the model the run is already using.
  # The reviewer is the gate and the whole claim of this pipeline is that nothing
  # passes on the author's own word — so if spend ever needs trimming, move the
  # implementer first and treat lowering the reviewer as a decision to revisit.
  rounds:
    develop: 3
    fix: 2

acceptance:
  rounds: 3
  budget:
    # Raised from 120/45 on 2026-09-08. The console milestones are nine screens and
    # four dialogs; 120 actions is not a walk of that, it is a glance at it. A
    # budget that runs out mid-scenario reports "could not", which is the honest
    # answer but a wasted round.
    actions: 220
    minutes: 75
  # Layered over `make e2e-up` / `e2e-down` rather than beside it — a second stack
  # with the same services diverges from the first within a milestone, and
  # acceptance would then be checking a configuration nobody ships. See
  # scripts/acceptance/stand.sh and .e2e/profile.yml.
  stand:
    up: "scripts/acceptance/stand.sh up"
    down: "scripts/acceptance/stand.sh down"
  # This project's own driver, not aikit's bin/drive: bin/drive attaches to a
  # Chromium over CDP, and the browser here is only reachable from inside the
  # stand's compose network. Naming the driver is also what keeps the agent from
  # spending budget hunting for hands it already has.
  #
  # The driver DOES write its own captures — every verb screenshots to
  # `.acceptance/<milestone>/<name>.png` on the host, and `--name` chooses the name
  # the report cites. The gate opens that directory, so a capture that is not on
  # disk did not happen; cite the name the driver wrote, not one you meant to.
  # (Corrected 2026-09-22: this preamble still described the MCP hands, which
  # `kind: command` stopped being on 2026-09-08. The paragraph below is the change
  # it was describing.)
  #
  # CHANGED 2026-09-08. The MCP hands drove the operator's own Chrome, which is
  # exactly what an unattended overnight run does not have. The driver below needs
  # no operator, no extension and no session: the browser is a container in the
  # stand's own compose project, started by scripts/acceptance/stand.sh under the
  # `browser` profile, publishing nothing. The MCP tools remain perfectly usable
  # when someone is sitting at the machine — they are simply no longer the thing
  # the pipeline depends on.
  hands:
    kind: command
    use: >-
      scripts/acceptance/drive.py — begin <milestone> --max-actions N --minutes M,
      then open <url>, click <target>, fill <target> <value>, type, press <key>,
      upload <target> <file>, back, reload, wait [seconds], snap, end.
      A target is addressed the way the accessibility snapshot reads it:
      `button=add user`, `link=all users`, `textbox=nickname`, `tab=Settings` —
      role=name, straight out of the tree you were just shown. `text=`, `label=`,
      `placeholder=` and `css=` exist for what has no role, `css=` last.
      Every call answers with the accessibility tree and writes its screenshot to
      .acceptance/<milestone>/<name>.png on the host; pass --name to choose the
      name the report will cite. Do not go looking for a browser and do not install
      one: `stand.sh up` has already started it.
  # One read-only SELECT, as a role with no write privilege — a property of the
  # database role, not an instruction. An acceptance agent able to fix the stand to
  # match its expectation eventually will, and will then report a pass.
  truth:
    kind: command
    use: "scripts/acceptance/query.py"
  browser:
    # `project`, corrected 2026-09-22. This block only ever mattered to aikit's own
    # bin/drive, which attaches to a Chromium over CDP; `hands` above names this
    # project's driver instead, and that driver launches its browser INSIDE the
    # stand's own container and talks to it over a socket there. So nothing
    # attaches over CDP and no operator Chrome is involved — which is what `local`
    # and a `cdp:` address claimed, both of them left behind by the change of
    # 2026-09-08 that moved the hands into the stand. A comment describing an
    # arrangement the file no longer uses is worse than no comment: the next reader
    # goes looking for port 9222.
    mode: project
  # Addresses and human-facing notes ONLY — never a file path, never a module
  # name. If a reader could learn from this block WHICH FILES changed, the
  # acceptance phase is worth less. The stand is plain HTTP on purpose (the e2e
  # overlay sets HASHI_PUBLIC_HTTPS=false) so the operator's session cookie is not
  # https-only and panel flows actually log in.
  entrypoints:
    - name: "Owner panel"
      url: "http://127.0.0.1:54200/panel/"
      note: "sign in with the username and password the stand prints when it comes up"
    - name: "Delivery endpoint"
      url: "http://127.0.0.1:54200/sub/{token}"
      note: "a friend's subscription; the token comes from the panel. Tokens shorter than 16 characters are refused on format before any lookup happens, so a short string is not a test of whether the token exists"
  seed: >-
    an empty control plane — the operator account exists and nothing else does:
    no nodes, no transports, no friends, no relay hops. Every awkward first-time
    step is still ahead of you, which is where the findings are.
  # Empty on purpose. A run builds images and writes to .e2e/artifacts/, and every
  # such path is already gitignored, so nothing TRACKED moves. Each entry here is a
  # place the tripwire stops watching — if a run ever trips the gate on a file
  # nobody edited, `verdict tree --show` names it before anything is added here.
  tripwire_ignore: []

# The security audit — `/aikit:security-audit`. ADDED 2026-09-22, with the move to
# aikit 0.5.0, which is the release that introduced it. Standalone on purpose: it
# is not part of autopilot, it does not run on a milestone, and it never fixes
# anything. A hunter attacks the stand below through the plugin's scope-fenced
# `bin/probe`; a refuter replays each proof of concept against a stand rebuilt
# from nothing and tries to disprove it; a mechanical gate keeps only what
# replays.
#
# WHY this project wants it. Its authentication is two things and both of them are
# unusual: one operator with no users table, and a 32-byte token in a URL PATH that
# is the entire credential for `/sub/{token}`. Nothing in `make verify` tries to
# cross either boundary — the e2e scenarios check that the product works, which is
# a different question from whether it can be made to misbehave.
security:
  # gray, chosen by the owner on 2026-09-22. The hunter is given the route table,
  # the roles and how tokens are shaped, and attacks the running stand with them.
  # black would spend a meaningful part of its budget rediscovering four surfaces
  # that are written down in one page; white would let it read its way to a
  # conclusion instead of proving one, and the proof is the whole product here.
  box: gray
  # Required for gray, and DRAFT until the owner approves it — its own STATUS line
  # says so. The rule the plugin enforces: a finding that leans on an unapproved
  # premise is a ranked line for the owner, not something that gets to block.
  threat_model: docs/security/threat-model.md
  # NO `scan:` KEY, deliberately. gitleaks, osv-scanner and semgrep are none of
  # them installed here, and adding one is an architect decision (CLAUDE.md), not
  # something an init decides on the owner's behalf. An absent key means "no
  # deterministic pre-pass ran", which is true. A key pointing at a command that is
  # not on PATH would mean "a pass ran and found nothing", which is a lie, and the
  # gate would print it under "Scanners" as though it were a result.
  scope:
    # The fence. One origin: the stand, on the e2e half of this project's
    # 54100–54299 loopback block. `bin/probe` checks every request against this
    # BEFORE a socket opens, so "only attack the stand" is a program and not a
    # sentence in a prompt.
    targets: ["http://127.0.0.1:54200"]
    # FALSE, and it stays false while the only target is loopback — probe needs no
    # attestation to reach 127.0.0.1. Setting it true is the owner stating IN
    # WRITING that they own a non-loopback address and may attack it. No agent may
    # set it. The real fleet's nodes are never a target of this: they are rented
    # hosts in other people's datacentres, and the charter's whole threat model is
    # about not drawing attention to them.
    authorized: false
  # The ACCEPTANCE stand with the audit's identities seeded on top — not a second
  # stack. scripts/security/stand.sh delegates `up` and `down` to
  # scripts/acceptance/stand.sh and adds seed.py; it also turns the browser off,
  # since the audit speaks HTTP through probe and never opens a page.
  #
  # WHY the identities are seeded there and not in the acceptance stand: acceptance
  # walks an EMPTY control plane on purpose, because the awkward first-time steps
  # are where its findings are. The audit needs the opposite — several identities
  # live at once, because an authorization boundary cannot be tested from one side.
  stand:
    up: "scripts/security/stand.sh up"
    down: "scripts/security/stand.sh down"
  # The identities the hunter keeps live at once. Neither of this project's
  # credentials is a header, so every `auth` here is a command:
  #
  #   - the operator's credential is a SIGNED COOKIE. Only probe's own jar can hold
  #     it, so the command hands over the username and password and names the probe
  #     verb that turns them into a session. probe installs a no-redirect handler, so
  #     the 303 to /panel/ IS the successful login and the Set-Cookie on it is the
  #     session; a refusal is 401, with one generic message for a wrong username and
  #     a wrong password alike. (Corrected 2026-09-22: this said a 200 meant failure.
  #     It does not — 200 is what a client that FOLLOWS the redirect sees on success,
  #     which is how scripts/security/seed.py rejected its own first login.)
  #   - a friend's credential is a PATH SEGMENT. There is nothing to pin with
  #     `probe auth` at all — the token goes in the URL, which is exactly the
  #     property under audit.
  #
  # And why a command rather than a literal token: a token is 32 random bytes minted
  # by the control plane, so every `stand up` mints different ones. The refuter runs
  # these AFTER its own fresh stand and gets that stand's tokens, which is what lets
  # it re-send a proof whose original bytes no longer exist.
  roles:
    - name: anon
    - name: operator
      auth: "login:scripts/security/role.sh operator"
    - name: friend_a
      auth: "login:scripts/security/role.sh friend_a"
    - name: friend_b
      auth: "login:scripts/security/role.sh friend_b"
    # A fourth identity the owner did not name, seeded because the boundary it
    # tests is a charter promise: "revocation is total" means a revoked token's
    # answer must be indistinguishable from a token that was never issued. That is
    # a comparison between two requests, so both sides have to exist before the
    # hunt starts — a hunter that revokes someone mid-run has spent budget and
    # still cannot replay the pair. Threat model §3.4.
    - name: friend_revoked
      auth: "login:scripts/security/role.sh friend_revoked"
  # The SAME read-only role acceptance reads through, reused rather than rebuilt:
  # `acceptance_ro` holds SELECT and nothing else, granted by the stand. It is what
  # tells *exploitable* from *looks exploitable* — the endpoint returned another
  # person's entry, but did that row really belong to them? A response cannot
  # answer that, and it is usually the thing in question.
  truth:
    kind: command
    use: "scripts/acceptance/query.py"
  # Enforced inside probe: a spent budget makes the next request fail with "could
  # not", never trail off silently. Sized for this surface rather than copied — four
  # surfaces and roughly sixty routes, five identities, and the interesting work is
  # the same route tried as each of them.
  budget:
    requests: 800
    minutes: 45
  # Rounds are spent on a DEFECTIVE report — a finding with no replayable proof, a
  # missing "could not reach" line — and not on hunting more. Finding bugs is the
  # success case, not a reason to loop.
  rounds: 2
  # Empty, for the same reason acceptance's is: a run writes only to .acceptance/
  # and to docker, and both are already gitignored, so nothing TRACKED moves. Every
  # entry here is a place the tripwire stops watching — if a run ever trips the gate
  # on a file nobody edited, `verdict tree --show` names it before anything is added.
  tripwire_ignore: []

git:
  # `develop`, not `main`. The fleet's iron rule (.claude/workflow.md): all PRs
  # target develop, and agents never push, merge or open a PR against main.
  main: develop
  branch_prefix: "task/"
  # The credential lives in deploy/warden/.env as GH_TOKEN and is wired into git
  # and `gh` at boot — no agent ever reads it. An empty GH_TOKEN is a supported
  # mode: the project stays local-only and reports changed files instead.
  pr: true
