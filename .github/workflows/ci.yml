# WHAT: lint and test every zone on push and pull request, then the acceptance
#       scenarios against a stack this workflow boots.
# WHY:  the fleet verifies its own zone before review; CI is what catches the
#       combination nobody ran locally. The e2e job exists because nothing ran
#       tests/e2e at all — `make test` excludes it by design and CI ran the same
#       three zone targets, so a scenario that had been failing for as long as it
#       had existed was found by accident, eleven milestones later.
# HOW:  one job per zone, so a red build names the zone that broke, plus one job
#       for the acceptance tier. ubuntu-latest ships a docker engine, which is
#       what the e2e job needs and the zone jobs deliberately do not.

name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  # So the acceptance tier can be re-run on a branch without pushing to it.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zone: [control, edge, infra]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: setup
        run: make setup
      - name: verify ${{ matrix.zone }}
        run: make test-${{ matrix.zone }}

  e2e:
    # A plain job, not `continue-on-error`. An advisory job reports a green tick
    # with an annotation nobody opens, which is the same hole one level up — and
    # the hole is the whole reason this job exists. Whether a red one BLOCKS a
    # merge is branch protection, a repository setting and the owner's to make;
    # this file's job is to make sure the red exists and is visible.
    #
    # It boots a real stack and builds two images, so it is the slow job here by
    # a wide margin. That cost is the point: it is the only thing in CI that runs
    # a container at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: setup
        run: make setup
      # `make e2e-verify` boots the stand, runs tests/e2e, and tears it down with
      # its volumes whatever the result. The three zone targets are not repeated
      # here — the matrix above already ran them.
      - name: acceptance scenarios
        run: make e2e-verify
