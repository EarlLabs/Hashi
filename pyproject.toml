[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hashi"
version = "0.0.0"
description = "Self-hosted multi-protocol VPN control plane"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "jinja2",
    # Persistence. The control database is the single source of truth for node
    # credentials and friend identities (core invariants §3), so it arrives as a
    # spine rather than as a cache: async SQLAlchemy over asyncpg, and Alembic
    # because `create_all` on a changed model silently diverges from a live
    # database and the failure mode is "every friend is locked out" (§2).
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    # Encryption of node and friend secrets at rest (§3). Fernet from
    # `cryptography` rather than anything hand-rolled, and rather than pgcrypto:
    # keeping it in the application means the database file, a dump and a stolen
    # backup are all useless without HASHI_SECRET_KEY, which never enters the
    # database's own process.
    "cryptography",
    # SSH is the only channel to a node, and control always dials out (§1). No
    # agent, nothing listening on the node for us.
    "asyncssh",
    # Signs the operator's session cookie. Starlette's SessionMiddleware requires
    # it; there is no unsigned mode worth having.
    "itsdangerous",
    # Form parsing, for the panel's login and its HTMX POSTs. FastAPI needs it
    # present to accept a `Form(...)` parameter at all.
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "pyyaml",
    # Acceptance hands, and ONLY when the operator's own Chrome is not reachable:
    # aikit's bin/drive attaches to a browser over CDP and needs this package to do
    # it. Approved by the owner on 2026-09-08 for unattended runs on a headless
    # host. It is dev-only and never enters the shipped image — the control plane
    # must not grow a browser. No `playwright install` is needed either: the driver
    # attaches to a Chromium that is already running, it does not launch one.
    "playwright",
]

# Found, not listed. An explicit list means every new transport package under
# edge/transports/ has to remember to edit this file, and forgetting produces the
# worst possible failure: green tests against the source tree, and a deployed
# image whose transport registry is silently one protocol short. The charter's
# fourth criterion is that a new protocol is one new package — so packaging has
# to follow the directory, not a list. Pinned by
# tests/e2e/edge/test_shipped_image_discovers_transports.py.
[tool.setuptools.packages.find]
include = ["control*", "edge*"]

# Templates are CODE here, not documentation: a transport's server.j2 IS its
# renderer's output, and the panel's HTML is the admin interface. Wheels ship
# only .py files unless told otherwise, so without this block the image builds
# clean, boots clean, and then raises TemplateNotFound the first time an operator
# renders a node config — at which point the only transport that "works" is the
# one nobody used yet. Same failure class as the package list above, one level
# down. Pinned by tests/e2e/edge/test_shipped_image_discovers_transports.py.
#
# Keyed on "*" — every package — and not on each transport by name, for the same
# reason the package list above is a glob: naming them here would mean a new
# protocol is one directory PLUS a line in this file, and forgetting the line
# reproduces exactly the failure this block prevents.
#
# ``*.css`` and ``*.woff2`` joined the list in M8, and for exactly the reason above.
# The redesigned console's stylesheets and its self-hosted fonts are served from
# /static; without them here the image builds clean, boots clean, and serves an
# unstyled panel with a 404 for every stylesheet — which looks like a CSS bug and is
# a packaging one. Pinned by
# tests/e2e/control/test_the_panel_fetches_nothing_from_a_third_party.py, which
# fetches every asset the pages link and requires the bytes to arrive.
[tool.setuptools.package-data]
"*" = ["*.j2", "*.html", "*.mako", "*.ini", "*.js", "*.css", "*.woff2"]

[tool.ruff]
target-version = "py314"
line-length = 100
# Vendored/rendered from Kaizen (see deploy/warden/README.md) — not ours to
# reformat, and a lint failure there would be a false signal about this repo's
# code. warden.py and .e2e/e2e_gen_secrets.py are rendered/exported by
# infra/agentkit/render.py in Kaizen; a fix belongs in the kit template
# (line-length under Cyrillic strings for the former), not here.
exclude = ["deploy/warden/vendor", "deploy/warden/warden.py", ".e2e/e2e_gen_secrets.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids a function call in an argument default, which is exactly how FastAPI
# declares dependencies (`session: AsyncSession = Depends(...)`, `x: str = Form(...)`).
# The rule exists to catch a mutable default evaluated once at import; here the call
# builds a marker object that FastAPI resolves per request, so the hazard the rule
# describes does not exist. Scoped to the route modules rather than silenced
# globally, so a genuine mutable default elsewhere is still caught.
"control/app/api/*.py" = ["B008"]
"control/app/panel/*.py" = ["B008"]
# Tests assert on exception types and use fixtures whose names shadow builtins in
# ways that are clearer than the alternative.
"tests/**" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Without importlib mode, two test modules with the same basename in different
# directories (tests/control/test_scaffold.py and tests/edge/test_scaffold.py, or
# two zones' e2e scenarios) collide with "import file mismatch".
#
# `-rs` because this project's zone rulebook asks a test that cannot run to skip LOUDLY,
# and every target here runs pytest with `-q`, under which a skip is one dot and a number
# in a summary line nobody reads. A scenario that quietly stops running is the failure
# `make verify` was created to end — the e2e suite had one for eleven milestones — and it
# now costs one printed reason per skip to see it.
addopts = "--import-mode=importlib -rs"
