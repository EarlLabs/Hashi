# hashi — base stack (production shape).
#
# WHAT: the services the control plane needs to run.
# WHY:  this file NEVER publishes a port. Everything reaches everything else on
#       the internal network; only Caddy is meant to face the world, and only
#       once a real deployment maps it. The dev overlay is the only file that
#       opens anything, and only on 127.0.0.1.
# HOW:  always run through the Makefile, which passes --env-file. Without it,
#       ${VAR} resolves to "" instead of failing — hence ${VAR:?...} below.

# Without this, the project name comes from the directory (`deploy`) — which
# tells an operator nothing, and collides with every other project scaffolded
# from this kit on the same host. The e2e stack deliberately overrides it with
# `-p hashi-e2e` so its volumes are separate and disposable.
name: hashi

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - hashi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  control:
    build:
      context: ..
      dockerfile: deploy/docker/control.Dockerfile
    restart: unless-stopped
    # Anchored so the `telegram-bot` service below reads the SAME configuration — M39.1. The
    # bot runs on this host beside the control plane and on the same trust boundary, so it
    # is built from the same ``Settings``: one list, not two that drift (the reason
    # HASHI_DATABASE_URL is composed once above a service that also needs it). The bot adds
    # the Telegram credentials to this; the Telegram settings themselves are NOT on this
    # list, because the web process must never poll (see the service below).
    environment: &control-environment
      HASHI_SECRET_KEY: ${HASHI_SECRET_KEY:?set HASHI_SECRET_KEY in .env}
      HASHI_PUBLIC_HOST: ${HASHI_PUBLIC_HOST:?set HASHI_PUBLIC_HOST in .env}
      # Composed from the same POSTGRES_* values the db service uses, so the two
      # cannot drift into "the app is configured for a database that does not exist".
      # `db` is the compose service name, and 5432 is its INSIDE-the-network port —
      # published ports never appear here (see the ports discussion in .env.example).
      HASHI_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      # The panel's single credential, as a hash. Generate it with
      # `python -m control.cli hash-password` — the plaintext never leaves the
      # owner's machine and never enters this file.
      HASHI_OPERATOR_USERNAME: ${HASHI_OPERATOR_USERNAME:?set HASHI_OPERATOR_USERNAME in .env}
      HASHI_OPERATOR_PASSWORD_HASH: ${HASHI_OPERATOR_PASSWORD_HASH:?set HASHI_OPERATOR_PASSWORD_HASH in .env}
      # The certificate delivery hosts are served under, by path INSIDE this container —
      # M27.6. Blank by default and NOT `:?`, because no host serving its own users'
      # subscription refreshes is a supported shape and is the shipped one: with these
      # unset every user refreshes from this control plane exactly as they always have.
      #
      # This service reads the two files and pushes their contents to a node on apply, so
      # the control plane needs them readable and the node needs no certificate authority.
      # They are named here rather than left to an `env_file` because this file
      # enumerates what the control plane may read, and a variable that is not on this
      # list does not exist inside the container however well it is set in `.env` — which
      # is exactly how this pair shipped unreachable in the first place.
      HASHI_DELIVERY_CERTIFICATE_PATH: ${HASHI_DELIVERY_CERTIFICATE_PATH:-}
      HASHI_DELIVERY_KEY_PATH: ${HASHI_DELIVERY_KEY_PATH:-}
      # Every OPTIONAL setting the control plane reads — M31.2. Blank when the operator
      # left it out of .env, and blank means "not set": `Settings` is built with
      # `env_ignore_empty`, so the default is the one written in control/app/settings.py
      # and nowhere else. They are listed here for the reason the pair above is: this
      # list is the whole of what the container can read, and the field walk of
      # 2026-10-02 set HASHI_FINDING_REMEASURE_INTERVAL in .env and found nothing inside
      # the container. The Settings screen names each of these as the variable that
      # changes its row, so an operator who believed it was told something false.
      #
      # HASHI_FINDING_REMEASURE_INTERVAL=0 stops this control plane dialling, on its own,
      # the nodes that carry a finding — which is what a restored one should not do before
      # its operator has looked (scripts/backup.sh holds it at 0 after a restore from the
      # bucket, until a publishing command brings this value back).
      HASHI_FINDING_REMEASURE_INTERVAL: ${HASHI_FINDING_REMEASURE_INTERVAL:-}
      HASHI_NODE_SETTLE_TIMEOUT: ${HASHI_NODE_SETTLE_TIMEOUT:-}
      HASHI_NODE_SETTLE_INTERVAL: ${HASHI_NODE_SETTLE_INTERVAL:-}
      HASHI_NODE_SSH_TIMEOUT: ${HASHI_NODE_SSH_TIMEOUT:-}
      HASHI_NODE_CONNECT_TIMEOUT: ${HASHI_NODE_CONNECT_TIMEOUT:-}
      HASHI_SESSION_MAX_AGE: ${HASHI_SESSION_MAX_AGE:-}
      HASHI_AUDIT_RETENTION_DAYS: ${HASHI_AUDIT_RETENTION_DAYS:-}
      # M34. The backup's quiet hour is read by the control plane too: the routing lists
      # are refreshed, and the entries they changed applied, in that hour — applying
      # restarts an entry's proxy, so it goes where the owner already said is quiet.
      HASHI_BACKUP_AT: ${HASHI_BACKUP_AT:-}
      HASHI_BACKUP_TZ: ${HASHI_BACKUP_TZ:-}
      HASHI_ROUTING_CHECK_INTERVAL: ${HASHI_ROUTING_CHECK_INTERVAL:-}
      HASHI_ROUTING_MAX_CHANGE: ${HASHI_ROUTING_MAX_CHANGE:-}
      HASHI_ROUTING_MAX_ENTRIES: ${HASHI_ROUTING_MAX_ENTRIES:-}
      HASHI_ROUTING_MAX_BYTES: ${HASHI_ROUTING_MAX_BYTES:-}
      HASHI_ROUTING_FETCH_TIMEOUT: ${HASHI_ROUTING_FETCH_TIMEOUT:-}
      # The routing sources the Routing screen OFFERS (it adds none by itself), as
      # `name|https-url|on-or-off` entries separated by `;`. THE ONE OPTIONAL SETTING
      # WHOSE DEFAULT LIVES HERE rather than in control/app/settings.py, and on purpose:
      # each is a URL, and a URL in code is a domain in code (CLAUDE.md). The settings
      # model's own default is "offer nothing"; this file is configuration, and .env can
      # replace the whole list. Each was read before it was offered (docs/decisions.md,
      # M34): the first is the NARROW list the owner chose — Russian sites that refuse
      # foreign addresses — and is switched on once added; the other three are broader
      # lists of sites to send direct and are added switched off. A list of BLOCKED sites
      # is never offered: its meaning is the opposite of "send direct".
      HASHI_ROUTING_SUGGESTED_SOURCES: ${HASHI_ROUTING_SUGGESTED_SOURCES:-itdoginfo-russia-outside|https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/outside-raw.lst|on;roscomvpn-whitelist|https://raw.githubusercontent.com/hydraponique/roscomvpn-geosite/master/data/whitelist|off;roscomvpn-category-ru|https://raw.githubusercontent.com/hydraponique/roscomvpn-geosite/master/data/category-ru|off;roscomvpn-geoip-whitelist|https://raw.githubusercontent.com/hydraponique/roscomvpn-geoip/master/release/text/whitelist.txt|off}
      # The three HASHI_TELEGRAM_* settings are deliberately NOT here — M39.1. They moved to
      # the `telegram-bot` service below, which is now the only process that polls: the web
      # process holding them while the poller lived in its lifespan was M37.4's shape, and
      # the lifespan no longer starts a poller (control/app/main.py). A token that reached
      # this service would configure nothing here.
    volumes:
      # The backup schedule's record, READ-ONLY — M28.5. It is written on the host by
      # scripts/backup-run.sh and holds dates, exit codes and the schedule's own settings:
      # no user, no node, no address, ever (CLAUDE.md — never log who connected to what).
      #
      # It is mounted rather than fetched because the question "when did a backup last
      # succeed, and has one failed since" cannot be asked of the bucket: the credential
      # this host holds may only write, so the object store cannot be read back and this
      # file is the only account of the backup history that exists here.
      #
      # Read-only, and that direction is the point: the schedule writes, the panel reads,
      # and the control plane can neither invent a successful backup nor erase a failed
      # one. A relative path, like every other path in this file, so the control plane
      # stays relocatable — and, as with the Caddyfile above, a bind mount resolves on the
      # DAEMON's filesystem, so on a remote engine this arrives empty, which reads as "no
      # backup has been recorded" rather than as a wrong answer. `make env` creates the
      # directory before any `up`, so the daemon never creates it as root.
      - ../backups/state:/var/lib/hashi/backup:ro
      # The delivery certificate and its key, READ-ONLY — M27.6. A relative path like
      # every other mount here, so the control plane stays relocatable, and read-only
      # because this service pushes these bytes and never writes them: renewal is the
      # operator replacing two files on the host, and a control plane that could write
      # into this directory could rewrite what it will push next.
      #
      # A DIRECTORY rather than two file mounts, and that is what makes renewal a copy
      # rather than a restart: a bind-mounted FILE is resolved once, when the container
      # is created, so replacing it on the host leaves the container reading the old
      # inode — the same trap `deploy/docker/caddy.Dockerfile` describes, pointed the
      # other way. Through a directory the container sees whatever is in it now, which
      # is what `services/delivery.configured_certificate` reads on every apply.
      #
      # Empty on a fleet that serves no delivery, which is the shipped shape. `make env`
      # creates it before any `up` so the daemon never creates it as root, exactly as it
      # does for the backup record above.
      - ../deploy/delivery:/etc/hashi/delivery:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # The owner's Telegram add-user bot, as its own process beside the control plane — M39.1.
  #
  # OFF BY DEFAULT: it is behind the `telegram-bot` profile, so `make up` (and every verb
  # that does not pass PROFILES) never starts it and an install with no bot is untouched —
  # exactly the shipped shape. Turn it on with `make up PROFILES=telegram-bot` (or the same
  # on `up-panel`), the way the acceptance browser is turned on with E2E_PROFILES.
  #
  # SAME IMAGE AS THE CONTROL PLANE, different command: the control image's entrypoint runs
  # uvicorn, and `command: ["bot"]` makes it run control/app/botmain.py — the poller alone —
  # instead (deploy/docker/entrypoint.sh dispatches). It is built from the identical
  # Dockerfile rather than sharing one `image:` tag, because an `image:` on a locally-built
  # service would have to carry a version string the pinning rule (tests/infra/test_compose
  # .py) otherwise rejects; the two builds are byte-identical through the cache.
  #
  # TIED TO THE CONTROL PLANE BY THE SHARED DATABASE and nothing else: same network, no new
  # protocol, no port. It reads the same Settings (the anchor), plus the three Telegram
  # settings that are now ONLY here — the web process must not also poll (one bot token, one
  # poller, or Telegram answers 409). It decrypts tokens to render the links it replies with
  # and to reach nodes on `/adduser`/`/apply`, which is why it holds the secret key and the
  # delivery material, same as the control plane: same host, same trust boundary, not a new
  # one. It waits for the control service to be healthy, by which point that service has run
  # the migrations this one deliberately does not.
  telegram-bot:
    profiles: ["telegram-bot"]
    build:
      context: ..
      dockerfile: deploy/docker/control.Dockerfile
    command: ["bot"]
    restart: unless-stopped
    environment:
      <<: *control-environment
      # The credentials and the dial target, the ONLY way the token reaches the container:
      # from .env, never a build argument or an image layer. Blank-tolerant like every
      # optional setting — a profile turned on with a blank token is refused loudly by
      # botmain, not silently idled — and the e2e overlay points the URL at the stand's fake.
      HASHI_TELEGRAM_BOT_TOKEN: ${HASHI_TELEGRAM_BOT_TOKEN:-}
      HASHI_TELEGRAM_OWNER_ID: ${HASHI_TELEGRAM_OWNER_ID:-}
      HASHI_TELEGRAM_API_URL: ${HASHI_TELEGRAM_API_URL:-}
    volumes:
      # The delivery certificate and its key, READ-ONLY — the same mount the control plane
      # takes, for the same reason: a `/adduser` or `/apply` that pushes to a node serving
      # its own delivery reads this pair (services/delivery), and the bot does that push
      # itself. No backup-record mount: the bot never reads the backup history.
      - ../deploy/delivery:/etc/hashi/delivery:ro
    depends_on:
      control:
        condition: service_healthy
    # No HTTP here to probe, so the healthcheck reads the heartbeat botmain rewrites while the
    # poll loop is alive (control/app/botmain.py HEARTBEAT_PATH) and calls it stale once it
    # stops — the one thing that distinguishes a wedged poller from a live one. The path is
    # shared between the two and has to agree.
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib, sys, time; p = pathlib.Path('/tmp/hashi-telegram-bot.alive'); sys.exit(0 if p.exists() and time.time() - p.stat().st_mtime < 60 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    # Built, not pulled, so the Caddyfile is IN the image: a bind mount of
    # ./caddy/Caddyfile is resolved on the daemon's filesystem, which is not
    # this checkout whenever the daemon is remote (the fleet's dind engine).
    # The upstream tag is still pinned — see deploy/docker/caddy.Dockerfile.
    build:
      context: ..
      dockerfile: deploy/docker/caddy.Dockerfile
    restart: unless-stopped
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?set CADDY_ACME_EMAIL in .env}
      HASHI_PUBLIC_HOST: ${HASHI_PUBLIC_HOST:?set HASHI_PUBLIC_HOST in .env}
      # The private site — the panel and the API — from M7. The name is what the
      # owner's device asks for over the management tunnel, and the port is where
      # Caddy listens for it INSIDE this container; which host address that port
      # then appears on is deploy/docker-compose.public.yml's decision, not this
      # file's. Both are required rather than defaulted: a default private host
      # would be the same name on every deployment, and a default port would be a
      # port the fleet could not move away from.
      HASHI_PRIVATE_HOST: ${HASHI_PRIVATE_HOST:?set HASHI_PRIVATE_HOST in .env}
      HASHI_PRIVATE_PORT: ${HASHI_PRIVATE_PORT:?set HASHI_PRIVATE_PORT in .env}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      control:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  hashi-db:
  caddy-data:
  caddy-config:
