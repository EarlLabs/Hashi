# hashi — what a deployed panel host publishes.
#
# WHAT: the overlay that opens ports on a real host: the delivery endpoint to the
#       whole internet, and the console on loopback — the `ssh -L` way in. The console
#       on the management tunnel's address is one mapping further, in
#       docker-compose.tunnel.yml, because that one needs an address this host has.
# WHY:  this file used to be a heredoc in docs/deploy/runbook.md that the operator
#       typed onto the box. That was tolerable while the answer was "Caddy, 80 and
#       443". M7 makes it three mappings whose CORRECTNESS IS THE MILESTONE — the
#       console is private exactly and only because its port is published on an
#       address the internet cannot reach — and a hand-typed file is where that
#       goes wrong silently. So it ships, it is reviewed, and tests read it.
#
#       It stays an OVERLAY rather than moving into the base file, because `ports:`
#       is a sequence and the Compose spec merges sequences by appending: a mapping
#       in the base file cannot be taken back, and would follow every `make up-dev`
#       and every `make e2e-up` onto a laptop. See the runbook, "The port-publication
#       gap".
# HOW:  `make up-panel`, which is `make up` plus this file and docker-compose.tunnel.yml
#       — or `make up-panel-over-ssh`, which is `make up` plus this file alone, for a
#       host with no management tunnel yet. Never `make up` alone on a deployed host:
#       that converges the stack back to the base file's shape and takes these ports
#       away again.

services:
  caddy:
    ports:
      # The delivery endpoint, and the ACME challenge that keeps its certificate
      # alive. Deliberately UNBOUND — every other published port in this repository
      # names an address, and this is the one that is supposed to face the world.
      # What is served here is `/sub/*` and a redirect to it; everything else is 404
      # (deploy/caddy/Caddyfile).
      - "80:80"
      - "443:443"
      # The console on the management tunnel's address is NOT here: it is the one
      # mapping that needs an address this host actually has, and a machine restored
      # from a bucket has no tunnel yet — so it lives in docker-compose.tunnel.yml and
      # `make up-panel` loads both (M28.10, finding 4). What is left in this file is
      # everything a deployed host publishes whether or not a tunnel exists.
      #
      # The way back in when the management tunnel is unavailable, which is the day
      # an emergency rotation is needed. Loopback only: nothing off this host can
      # reach it, and an operator who can already open an SSH session forwards it to
      # their own machine with `ssh -L`. Published here rather than left to a
      # separate emergency overlay on purpose — a fallback that has to be installed
      # during the emergency is a fallback that does not exist.
      - "127.0.0.1:${HASHI_PRIVATE_PORT:?set HASHI_PRIVATE_PORT in .env}:${HASHI_PRIVATE_PORT:?set HASHI_PRIVATE_PORT in .env}"
