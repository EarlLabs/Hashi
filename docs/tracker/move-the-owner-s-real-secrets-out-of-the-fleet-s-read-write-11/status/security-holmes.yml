progress: >-
  Reviewed the implementation spec for dev-potts and the review task, against the
  tree at 50fe8c1. Enumerated the warden container's host-side mounts and build
  context myself rather than taking the spec's list on trust; checked the
  .dockerignore / Dockerfile build-context controls; traced every leak-back path
  tree-wide (Makefile, deploy/**, .env.example, .e2e/, scripts/, .github/,
  .claude/**, README.md, CLAUDE.md); attacked the guard's error text, the file
  modes at the new location, Q1's widening, and the decision to keep the
  .env.example overlay. Findings written to the artefact below.
findings:
  critical: 1
  high: 2
  medium: 5
  low: 4
  info: 2
findings_summary:
  - "C-1 (critical) — `make env` manufactures the half-migration and permanently
     silences the guard. `env` is a prerequisite of up/up-dev/e2e-up, and the
     guard's own message offers `make env` as a remedy; either creates a
     placeholder env file at the NEW path from .env.example, so the stack boots on
     HASHI_SECRET_KEY=replace-me-with-48-random-bytes and POSTGRES_PASSWORD=replace-me
     (published in this repository), ${VAR:?} never fires, `test -f $(HASHI_ENV_FILE)`
     becomes true forever, and the owner's real .env stays inside ../..:/repo with
     nothing left to warn him. Fix: `make env` must refuse when ./.env exists
     (`test -f` only, no read), and every env-consuming verb must warn while a
     repo-root .env survives. Spec §5.2, §5.4; Makefile:27-28,77,81,160."
  - "H-1 (high) — .claude/projects/04-infra-rulebook.md:109 still prescribes
     `${VAR:?set this in .env}`. Q10 removes seven such messages from
     deploy/docker-compose.yml; task 8 of this epic adds new mandatory secrets to
     that same file, written in good faith from that unchanged rulebook, and
     restores the leak-back path inside the same epic."
  - "H-2 (high) — no sentinel holds the leak-back corrections. Q5's own reasoning
     ('held by a test so removing it turns something red') is applied to the
     overlay alone; the seven compose messages, the .env.example header and
     deploy/AGENTS.md:32 are corrected once and asserted by nothing. §4.1 also
     authorises ADDING an .env.example header without requiring the contradicting
     line 1 ('Copy to .env and fill in') to be replaced."
  - "M-1 (medium) — build-context control is half-asserted. Confirmed as checked
     facts: the repo-root .dockerignore DOES apply to `context: ../..`, and .env
     cannot reach a layer today (two controls: .dockerignore:10 plus no COPY . .
     in either Dockerfile). But a `deploy/warden/Dockerfile.dockerignore` would
     override the root file entirely and (e) would stay green, and the patterns
     cover `.env` not `.env*`. Recommend .dockerignore ownership moves into infra."
  - "M-2 (medium) — the guard's pasted `mv` command (spec §5.2) drops the
     `chmod 700` on the directory that spec §9 has. Under the owner's observed
     umask 002 that yields a group-writable ~/.config/hashi, and `mv` preserves the
     source mode (/repo/.env is 0664 today), so the remediation ends with weaker
     permissions than the file started with. §5.2 must be byte-identical to §9."
  - "M-3 (medium) — the warden-down/warden-logs bare-compose fallback (§5.3) can
     address a different compose project than warden-up if the env file ever
     defines COMPOSE_PROJECT_NAME/COMPOSE_FILE/DOCKER_HOST, so `warden-down` could
     report success and stop nothing. Pin `-p hashi-warden`, as Makefile:156
     already does for e2e."
  - "M-4 (medium) — Q3's 'never guard what stops things' is applied to warden only;
     after the move `make down`/`logs`/`ps` fail on the missing env file in the
     most likely post-landing state."
  - "M-5 (medium) — six architect-owned documents still point at the old location
     (README.md:59, CLAUDE.md:70, CLAUDE.md:81, .claude/git-workflow.md:138,
     03-security-checklist.md:83, 04-infra-rulebook.md:113) and NO task in the epic
     decomposition covers any of them. CLAUDE.md:81 is the one I would not defer —
     it tells every agent in the container that the live credential is in .env."
  - "L-1..L-4 (low) — $HOME is not a stable identity (sudo / service user / empty
     HOME select different files; guard still fails closed); §7(b) needs its $HOME
     and realpath semantics pinned; nothing checks the mode of an existing file at
     the new location; and S1 must be explicitly forbidden from asserting on a
     repo-root .env, because the overlay makes /repo/.env exist inside the very
     container where `make test-infra` runs."
  - "I-1/I-2 (info) — the deliberate-stale-string ledger is incomplete
     (deploy/warden/warden.py:142 and deploy/warden/docker-compose.yml:56 join
     entrypoint.sh:54); Makefile:137 puts TRACKER_ADMIN_TOKEN on a command-line
     assignment (pre-existing, out of scope, recorded so it is not rediscovered)."
holds_as_designed:
  - "Axis 1 — the mount enumeration holds. Host-side paths reaching the container
     are ../..:/repo (line 65), ../../.env.example:/repo/.env:ro (line 79),
     hashi-warden-state:/state (line 82) and build.context ../.. (line 28). No
     docker socket. ~/.config/hashi/hashi.env is under none of them."
  - "Axis 4 — the guard cannot print a secret VALUE as specified: test -f only, no
     source/cat/grep/export, fires before compose, prints the path alone. Printing
     the path is acceptable. Require the `@` prefix so Make does not echo the recipe."
  - "Axis 6 — Q1's widening is NECESSARY and read correctly. /repo/.env carries
     HASHI_SECRET_KEY, POSTGRES_PASSWORD and GH_TOKEN and sits under ../..:/repo;
     a warden-only file would fail frozen S1 as written."
  - "Axis 7 — keeping the .env.example:/repo/.env:ro overlay is RIGHT. It is :ro,
     the values are visibly placeholders, and after C-1 is fixed it is the only
     thing still masking a .env that reappears. Removing it would trade a working
     control for tidiness."
  - "Axis 8 — the honesty holds, unhedged: §1 lines 46-49, §9, §12.7, the verbatim
     S2 sentence and the ban on 'green'. Two gaps: the residual risk is not required
     in status/dev-potts.yml, and nothing ever checks whether the owner did the mv."
  - "Git history is clean: .env is untracked and `git log --all -- .env` is empty,
     so .git/ (which IS inside the read-write mount) holds no copy."
prohibition_compliance:
  read_env: false
  note: >-
    I did not cat/head/tail/open/copy/move/delete /repo/.env. One incident is
    disclosed in full in §0 of the findings: a tree-wide `grep -rn "\.env\b" .`
    run to enumerate REFERENCES matched inside the real file and printed its two
    comment lines, which are .env.example's header verbatim — no variable, value
    or credential was disclosed, and the search was not re-run. Reported against
    myself because it is this task's threat model executing live: the prompt-level
    prohibition did not hold against an ordinary repository grep, which is the
    empirical case for the control this task builds. Metadata only was read
    otherwise: /repo/.env exists and is mode 0664 (load-bearing for M-2).
